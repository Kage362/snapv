<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snapvault</title>
<style>
:root{--bg:#f4f5fa;--panel:#fff;--text:#14161f;--muted:#6b7080;--line:#e3e5ee;--accent:#6d5efc;--btn:#6d5efc;--r:12px;--code:#f0f1f7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f17;--panel:#161926;--text:#eceef8;--muted:#8a90a8;--line:#262a3d;--code:#0f111b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f17;--panel:#161926;--text:#eceef8;--muted:#8a90a8;--line:#262a3d;--code:#0f111b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.5px}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.sp{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--btn);color:#fff;border:0;border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.g{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.d{background:#e5484d}.btn.s{padding:5px 10px;font-size:13px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;width:100%}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:200px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
main{display:grid;grid-template-columns:250px 1fr;gap:20px;padding:20px;max-width:1300px;margin:auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:14px}
aside h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lang{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);cursor:pointer;border:1px solid transparent}
.lang:hover{background:var(--bg)}.lang.on{border-color:var(--accent);background:var(--bg)}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:none}
.cnt{margin-left:auto;background:var(--bg);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:24px;letter-spacing:-.5px}.stat span{color:var(--muted);font-size:13px}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.bar input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.sn h4{margin:0;font-size:16px}.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
pre{background:var(--code);border-radius:var(--r);padding:10px 12px;overflow:auto;max-height:130px;margin:10px 0;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.mut{color:var(--muted);font-size:12.5px}
.ov{position:fixed;inset:0;background:rgba(5,6,12,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.win{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.wh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.wb{padding:16px;display:grid;gap:12px}.wf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=color]{padding:2px;height:38px}
.an{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.an div{background:var(--bg);border-radius:var(--r);padding:8px;text-align:center}.an b{display:block;font-size:18px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:99px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:40px 10px}.hc{color:#7c8599;font-style:italic}.hs{color:#22a55b}.hn{color:#e59a0c}.hk{color:var(--accent);font-weight:600}.n{display:inline-block;width:2.6em;color:var(--muted);user-select:none}.dr{background:rgba(229,72,77,.22)}.dg{background:rgba(40,200,64,.22)}.grid.list{grid-template-columns:1fr}.bar select{width:auto}@keyframes fl{50%{transform:scale(1.12) rotate(-4deg)}}.fl{display:inline-block;animation:fl 1.6s ease-in-out infinite}.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:4px;overflow-x:auto;padding-bottom:4px}.hm i{border-radius:4px;background:var(--bg);border:1px solid var(--line)}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}.ov.on .win{animation:pop .22s ease-out}.ov{background:radial-gradient(circle at 30% 20%,rgba(109,94,252,.28),rgba(5,6,12,.72));backdrop-filter:blur(8px)}.win{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(20px);border-radius:24px;border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}.wh{background:transparent;backdrop-filter:blur(10px);font-size:16px}.wh::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),#22d3ee,transparent)}.btn:not(.g):not(.d){background:linear-gradient(135deg,var(--btn),color-mix(in srgb,var(--btn) 65%,#22d3ee));box-shadow:0 8px 20px -8px var(--btn)}.sn{transition:transform .2s,box-shadow .2s}.sn:hover{transform:translateY(-3px);box-shadow:0 14px 34px -14px var(--accent)}.dots i{cursor:pointer;transition:.15s}.dots i:hover{transform:scale(1.25)}.swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px}.sw{display:flex;align-items:center;gap:8px;border:2px solid;border-radius:var(--r);padding:9px 10px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s}.sw:hover{transform:translateY(-2px)}.sw i{width:14px;height:14px;border-radius:50%;flex:none}body,.card,header,.win,.lang,input,textarea,select,pre{transition:background .3s,color .3s,border-color .3s}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#g)"/><rect x="13" y="7" width="14" height="7" rx="2.5" fill="#fff"/><rect x="9" y="16.5" width="22" height="7" rx="2.5" fill="#fff" opacity=".85"/><rect x="5" y="26" width="30" height="7" rx="2.5" fill="#fff" opacity=".65"/></svg>
    <div>Snapvault<small>Tu bóveda de código</small></div>
  </div>
  <div class="sp"></div>
  
  <button class="btn g s" data-a="cmp">⇄</button>
  
  <button class="btn g s" onclick="winImport()">⬆ Importar</button>
  <button class="btn g s" onclick="winExport()">⬇ Exportar</button>
  <button class="btn g s" onclick="winSettings()">🎨 Personalizar</button>
  <button class="btn s" onclick="winSnip()">＋ Nuevo snippet</button>
</header>
<main>
  <aside class="card">
    <h3>Lenguajes</h3>
    <div id="langs"></div>
    <button class="btn g s" style="width:100%;margin-top:10px" onclick="winLang()">＋ Nuevo lenguaje</button>
  </aside>
  <section>
    <div class="card" id="streak" style="margin-bottom:16px"></div>
    <div class="stats" id="stats"></div>
    <div class="bar"><input id="q" placeholder="Buscar título, código o #etiqueta (Ctrl+K)" oninput="render()"><select id="so" onchange="render()"><option value="date">Recientes</option><option value="title">Título</option><option value="size">Tamaño</option><option value="fav">Solo favoritos</option></select><select id="fo" onchange="render()"><option value="">Todas las carpetas</option></select><button class="btn g s" data-a="layout">☰ / ▦</button></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div class="ov" id="ov" onclick="if(event.target===this)closeW()"><div class="win" id="win"></div></div>
<div id="toast"></div>
<script>
var KEY="snapvault:v1",mem=null;
var DEF={langs:[{id:"js",name:"JavaScript",icon:"🟨",color:"#f7df1e"},{id:"py",name:"Python",icon:"🐍",color:"#3776ab"},{id:"html",name:"HTML",icon:"🌐",color:"#e34f26"},{id:"css",name:"CSS",icon:"🎨",color:"#2965f1"},{id:"ts",name:"TypeScript",icon:"🔷",color:"#3178c6"},{id:"java",name:"Java",icon:"☕",color:"#e76f00"},{id:"cs",name:"C#",icon:"🟣",color:"#68217a"},{id:"cpp",name:"C++",icon:"⚙️",color:"#00599c"},{id:"c",name:"C",icon:"🔧",color:"#5c6bc0"},{id:"go",name:"Go",icon:"🐹",color:"#00add8"},{id:"rust",name:"Rust",icon:"🦀",color:"#dea584"},{id:"php",name:"PHP",icon:"🐘",color:"#777bb4"},{id:"ruby",name:"Ruby",icon:"💎",color:"#cc342d"},{id:"swift",name:"Swift",icon:"🕊️",color:"#fa7343"},{id:"kt",name:"Kotlin",icon:"🟪",color:"#7f52ff"},{id:"dart",name:"Dart",icon:"🎯",color:"#0175c2"},{id:"sql",name:"SQL",icon:"🗄️",color:"#336791"},{id:"bash",name:"Bash",icon:"🐚",color:"#4eaa25"},{id:"json",name:"JSON",icon:"📋",color:"#9e9e9e"},{id:"react",name:"React",icon:"⚛️",color:"#61dafb"},{id:"vue",name:"Vue",icon:"💚",color:"#42b883"},{id:"svelte",name:"Svelte",icon:"🔥",color:"#ff3e00"},{id:"ng",name:"Angular",icon:"🅰️",color:"#dd0031"},{id:"node",name:"Node.js",icon:"🟢",color:"#68a063"},{id:"lua",name:"Lua",icon:"🌙",color:"#000080"},{id:"r",name:"R",icon:"📊",color:"#276dc3"},{id:"md",name:"Markdown",icon:"📝",color:"#607d8b"},{id:"yaml",name:"YAML",icon:"📄",color:"#cb171e"},{id:"docker",name:"Docker",icon:"🐳",color:"#2496ed"},{id:'perl',name:'Perl',icon:'🐪',color:'#39457e'},{id:'scala',name:'Scala',icon:'🔴',color:'#dc322f'},{id:'hs',name:'Haskell',icon:'🎩',color:'#5e5086'},{id:'ex',name:'Elixir',icon:'💧',color:'#6e4a7e'},{id:'clj',name:'Clojure',icon:'🧬',color:'#5881d8'},{id:'jl',name:'Julia',icon:'🔮',color:'#9558b2'},{id:'sol',name:'Solidity',icon:'⛓️',color:'#363636'},{id:'gql',name:'GraphQL',icon:'🕸️',color:'#e10098'},{id:'scss',name:'SCSS',icon:'💅',color:'#cd6799'},{id:'tw',name:'Tailwind',icon:'🌬️',color:'#06b6d4'},{id:'next',name:'Next.js',icon:'▲',color:'#808080'},{id:'nuxt',name:'Nuxt',icon:'🏔️',color:'#00dc82'},{id:'astro',name:'Astro',icon:'🚀',color:'#ff5d01'},{id:'deno',name:'Deno',icon:'🦕',color:'#70ffaf'},{id:'bun',name:'Bun',icon:'🥟',color:'#fbf0df'},{id:'flutter',name:'Flutter',icon:'🦋',color:'#02569b'},{id:'ps',name:'PowerShell',icon:'💠',color:'#2671be'},{id:'mat',name:'MATLAB',icon:'🧮',color:'#e16737'},{id:'asm',name:'Assembly',icon:'🧱',color:'#6e4c13'},{id:'zig',name:'Zig',icon:'⚡',color:'#f7a41d'},{id:'objc',name:'Objective-C',icon:'🍎',color:'#438eff'},{id:'groovy',name:'Groovy',icon:'🎷',color:'#4298b8'},{id:'fs',name:'F#',icon:'🔶',color:'#b845fc'},{id:'ocaml',name:'OCaml',icon:'🐫',color:'#ee6a1a'},{id:'nim',name:'Nim',icon:'👑',color:'#ffe953'},{id:'tf',name:'Terraform',icon:'🏗️',color:'#7b42bc'},{id:'nginx',name:'Nginx',icon:'🛰️',color:'#009639'},{id:'regex',name:'Regex',icon:'🔍',color:'#f59e0b'},{id:'xml',name:'XML',icon:'📰',color:'#e37933'},{id:'toml',name:'TOML',icon:'🧾',color:'#9c4221'},{id:'vim',name:'Vim',icon:'📟',color:'#019733'}],snips:[{id:'__demo__',title:'\ud83d\udc4b Ejemplo: Estructura HTML5',lang:'html',code:'<!DOCTYPE html>\n<html lang=\'es\'>\n<head>\n  <meta charset=\'UTF-8\'>\n  <meta name=\'viewport\' content=\'width=device-width, initial-scale=1.0\'>\n  <title>Mi p\u00e1gina</title>\n  <link rel=\'stylesheet\' href=\'styles.css\'>\n</head>\n<body>\n  <header>\n    <h1>Hola mundo</h1>\n  </header>\n  <main>\n    <p>Aqu\u00ed va el contenido principal.</p>\n  </main>\n  <footer>\n    <p>2026 Mi sitio</p>\n  </footer>\n  <script src=\'app.js\'><\/script>\n</body>\n</html>',problem:'Estructura base de cualquier p\u00e1gina web en HTML5. Incluye charset, viewport para m\u00f3viles, secciones sem\u00e1nticas y links a CSS y JS externos.',diff:'easy',notes:'',folder:'Ejemplos',tags:['html5','estructura','base'],fav:false,h:[],date:'2026-01-01T00:00:00.000Z',demo:true}],seed:3,cfg:{accent:"#6d5efc",btn:"#6d5efc",radius:12,theme:"auto",bg:null,panel:null,text:null,muted:null,line:null,code:null}};
var S=load(),filter="all";
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.langs&&d.snips){if((d.seed||0)<3){DEF.langs.forEach(function(l){if(!d.langs.some(function(x){return x.id===l.id}))d.langs.push(l)});d.seed=3}var merged=Object.assign({},DEF,d,{cfg:Object.assign({},DEF.cfg,d.cfg)});var hasReal=merged.snips.some(function(x){return!x.demo});if(hasReal)merged.snips=merged.snips.filter(function(x){return!x.demo});return merged}}}catch(e){}return mem?JSON.parse(mem):JSON.parse(JSON.stringify(DEF))}
function save(){var j=JSON.stringify(S);mem=j;try{localStorage.setItem(KEY,j)}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},1800)}
function lang(id){return S.langs.find(function(l){return l.id===id})||{name:"Otro",icon:"📄",color:"#888"}}
function analyze(c){var L=c.split("\n"),nb=L.filter(function(l){return l.trim()}).length,cm=L.filter(function(l){return /^\s*(\/\/|#|\/\*|\*|<!--|--)/.test(l)}).length,fn=(c.match(/\b(function|def|fn|func|class)\b|=>/g)||[]).length;return{lines:L.length,code:nb,chars:c.length,words:(c.match(/\S+/g)||[]).length,comments:cm,funcs:fn,kb:(new Blob([c]).size/1024).toFixed(1)}}
function applyCfg(){var r=document.documentElement,c=S.cfg,s=r.style;s.setProperty('--accent',c.accent);s.setProperty('--btn',c.btn);s.setProperty('--r',c.radius+'px');['bg','panel','text','muted','line','code'].forEach(function(k){if(c[k])s.setProperty('--'+k,c[k]);else s.removeProperty('--'+k)});if(c.theme==='dark'||c.theme==='light')r.setAttribute('data-theme',c.theme);else r.removeAttribute('data-theme')}
function render(){
  var q=($("q").value||"").toLowerCase();
  $("langs").innerHTML='<div class="lang '+(filter==="all"?"on":"")+'" onclick="setF(\'all\')"><div class="ic" style="background:var(--bg)">📚</div>Todos<span class="cnt">'+S.snips.length+'</span></div>'+S.langs.map(function(l){var n=S.snips.filter(function(s){return s.lang===l.id}).length;return '<div class="lang '+(filter===l.id?"on":"")+'" onclick="setF(\''+l.id+'\')"><div class="ic" style="background:'+esc(l.color)+'33">'+esc(l.icon)+'</div>'+esc(l.name)+'<span class="cnt">'+n+'</span></div>'}).join("");
  var tot=S.snips.reduce(function(a,s){return a+s.code.length},0),used=S.langs.filter(function(l){return S.snips.some(function(s){return s.lang===l.id})}).length;
  $("stats").innerHTML=[[S.snips.length,"Snippets"],[S.langs.length,"Lenguajes"],[used,"En uso"],[(tot/1024).toFixed(1)+" KB","Código guardado"]].map(function(x){return '<div class="card stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("");
  var list=S.snips.filter(function(s){return(filter==="all"||s.lang===filter)&&(!q||(s.title+s.code).toLowerCase().indexOf(q)>-1)});
  $("grid").innerHTML=list.length?list.map(function(s){var l=lang(s.lang),a=analyze(s.code);return '<div class="card sn"><div class="row"><h4>'+esc(s.title)+'</h4><span class="sp"></span><span class="chip">'+esc(l.icon)+' '+esc(l.name)+'</span></div><pre>'+esc(s.code.split("\n").slice(0,6).join("\n"))+'</pre><div class="mut">'+a.lines+' líneas · '+a.funcs+' funciones · '+a.kb+' KB</div><div class="row" style="margin-top:10px"><button class="btn s" onclick="winView(\''+s.id+'\')">Ver</button><button class="btn g s" onclick="winSnip(\''+s.id+'\')">Editar</button><button class="btn g s" onclick="cp(\''+s.id+'\')">Copiar</button><button class="btn d s" onclick="del(\''+s.id+'\')">✕</button></div></div>'}).join(""):'<div class="card empty" style="grid-column:1/-1">Aún no hay snippets aquí.<br>Pulsa «Nuevo snippet» para guardar tu primer código.</div>';
}
function setF(f){filter=f;render()}
function win(title,body,foot){$("win").innerHTML='<div class="wh"><div class="dots"><i onclick="closeW()"></i><i></i><i></i></div><b>'+title+'</b></div><div class="wb">'+body+'</div>'+(foot?'<div class="wf">'+foot+'</div>':"");$("ov").classList.add("on")}
function closeW(){$("ov").classList.remove("on")}
function winSnip(id){
  var s=id?S.snips.find(function(x){return x.id===id}):{title:"",lang:filter!=="all"?filter:S.langs[0]?S.langs[0].id:"",code:"",notes:""};
  win(id?"Editar snippet":"Nuevo snippet",'<div class="two"><label>Título<input id="f_t" value="'+esc(s.title)+'"></label><label>Lenguaje<select id="f_l">'+S.langs.map(function(l){return '<option value="'+l.id+'"'+(l.id===s.lang?" selected":"")+'>'+esc(l.icon)+" "+esc(l.name)+'</option>'}).join("")+'</select></label></div><label>Código<textarea id="f_c" spellcheck="false">'+esc(s.code)+'</textarea></label><label>Notas<input id="f_n" value="'+esc(s.notes||"")+'"></label>','<button class="btn g" onclick="closeW()">Cancelar</button><button class="btn" onclick="saveSnip(\''+(id||"")+'\')">Guardar</button>')}
function saveSnip(id){var t=$("f_t").value.trim(),c=$("f_c").value;if(!t||!c.trim()){toast("Título y código son obligatorios");return}var o={title:t,lang:$("f_l").value,code:c,notes:$("f_n").value,date:new Date().toISOString()};if(id){Object.assign(S.snips.find(function(x){return x.id===id}),o)}else{o.id=uid();S.snips.unshift(o)}save();closeW();render();toast("Guardado ✓")}
function winView(id){var s=S.snips.find(function(x){return x.id===id}),l=lang(s.lang),a=analyze(s.code);
